name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: python -m build

  npm-installer:
    name: npm installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check npm wrapper
        working-directory: npm/agent-memory-orchestrator-cli
        run: npm run check

      - name: Verify npm package contents
        working-directory: npm/agent-memory-orchestrator-cli
        run: npm pack --dry-run

  peer-netd:
    name: peer-netd Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.6"
          cache-dependency-path: peer-netd/go.sum

      - name: Test peer-netd
        working-directory: peer-netd
        run: go test ./...

      - name: Build peer-netd
        working-directory: peer-netd
        run: go build -trimpath -o ../.tmp/amo-peer-netd ./cmd/amo-peer-netd

  peer-netd-package:
    name: peer-netd packaged binary smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.6"
          cache-dependency-path: peer-netd/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build packaged peer-netd binaries for primary desktop targets
        run: |
          python scripts/build_peer_netd_binaries.py --target linux/amd64 --target windows/amd64 --target darwin/amd64 --target darwin/arm64

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify wheel includes peer-netd binary
        shell: python
        run: |
          import sys
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("no wheel built")
          with zipfile.ZipFile(wheels[-1]) as wheel:
              names = set(wheel.namelist())
          expected = {
              "agent_memory_orchestrator/bin/linux-amd64/amo-peer-netd",
              "agent_memory_orchestrator/bin/windows-amd64/amo-peer-netd.exe",
              "agent_memory_orchestrator/bin/darwin-amd64/amo-peer-netd",
              "agent_memory_orchestrator/bin/darwin-arm64/amo-peer-netd",
          }
          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f"missing packaged peer-netd binaries: {missing}")
