name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: python -m build

  npm-installer:
    name: npm installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check npm wrapper
        working-directory: npm/agent-memory-orchestrator-cli
        run: npm run check

      - name: Verify npm package contents
        working-directory: npm/agent-memory-orchestrator-cli
        run: npm pack --dry-run

  antelligent-desktop:
    name: Antelligent desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/antelligent/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/antelligent
        run: npm ci

      - name: Build frontend
        working-directory: apps/antelligent
        run: npm run build

      - name: Build portable Tauri shell smoke
        working-directory: apps/antelligent
        run: npx tauri build --debug --no-bundle

  peer-public-package:
    name: peer public package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify public packages exclude private peer runtime artifacts
        shell: python
        run: |
          import tarfile
          import zipfile
          from pathlib import Path

          patterns = (
              "peer-netd/",
              "go.mod",
              "go.sum",
              "agent_memory_orchestrator/bin/",
              "amo-peer-netd.exe",
              "infra/",
              ".evidence/",
              ".graph/",
              ".data/",
              ".tmp/",
              ".amo-spool/",
              "host.invite.json",
              "friend-invite-code.txt",
              "friends.txt",
          )
          archives = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          if not archives:
              raise SystemExit("no Python package archives built")
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as handle:
                      names = handle.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as handle:
                      names = handle.getnames()
              hits = sorted({name for name in names for pattern in patterns if pattern in name})
              if hits:
                  raise SystemExit(f"public package leaked private peer/runtime artifact(s): {hits[:25]}")
