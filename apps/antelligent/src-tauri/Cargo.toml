[package]
name = "antelligent"
version = "0.1.0"
description = "Floating Antelligent companion for Agent Memory Orchestrator"
authors = ["Agent Memory Orchestrator Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "antelligent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
