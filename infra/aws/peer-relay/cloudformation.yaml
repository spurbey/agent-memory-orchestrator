AWSTemplateFormatVersion: "2010-09-09"
Description: AMO libp2p relay and rendezvous helper node.

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI from AWS public SSM parameters.
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Small EC2 instance type for the relay helper.
  RepositoryUrl:
    Type: String
    Default: https://github.com/spurbey/agent-memory-orchestrator.git
    Description: Git repository containing peer-netd.
  RepositoryRef:
    Type: String
    Default: main
    Description: Branch, tag, or commit to deploy. Must be pushed and reachable from the instance.
  RelayNodeId:
    Type: String
    Default: amo-relay-prod
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$"
    Description: Stable AMO node id for the relay helper.
  RelayNamespace:
    Type: String
    Default: amo-peer-default
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$"
    Description: Suggested rendezvous namespace for this trust group.
  RelayPort:
    Type: Number
    Default: 4001
    MinValue: 1024
    MaxValue: 65535
    Description: Public TCP port used by libp2p.
  RelayApiPort:
    Type: Number
    Default: 8798
    MinValue: 1024
    MaxValue: 65535
    Description: Localhost-only health/API port on the EC2 instance.
  RelayIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to dial the relay TCP port. Use a narrower CIDR for private beta deployments.
  VpcId:
    Type: String
    Default: ""
    Description: Optional VPC id. Leave blank to use the account default VPC.
  SubnetId:
    Type: String
    Default: ""
    Description: Optional public subnet id. Leave blank to use a default subnet.
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name. Not required because the instance uses SSM.

Conditions:
  HasVpcId: !Not [!Equals [!Ref VpcId, ""]]
  HasSubnetId: !Not [!Equals [!Ref SubnetId, ""]]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  RelayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: AMO
        - Key: Component
          Value: peer-relay

  RelayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RelayRole

  RelaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow AMO libp2p relay traffic.
      VpcId: !If [HasVpcId, !Ref VpcId, !Ref AWS::NoValue]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref RelayPort
          ToPort: !Ref RelayPort
          CidrIp: !Ref RelayIngressCidr
          Description: AMO libp2p relay and rendezvous traffic.
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow package installation and libp2p outbound traffic.
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-relay-sg
        - Key: Project
          Value: AMO
        - Key: Component
          Value: peer-relay

  RelayEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-relay-eip
        - Key: Project
          Value: AMO
        - Key: Component
          Value: peer-relay

  RelayInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref RelayInstanceProfile
      SubnetId: !If [HasSubnetId, !Ref SubnetId, !Ref AWS::NoValue]
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SecurityGroupIds:
        - !Ref RelaySecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-relay
        - Key: Project
          Value: AMO
        - Key: Component
          Value: peer-relay
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/amo-relay-bootstrap.log | logger -t amo-relay-bootstrap -s 2>/dev/console) 2>&1

          dnf update -y
          dnf install -y git golang python3

          id -u amo-relay >/dev/null 2>&1 || useradd --system --create-home --home-dir /var/lib/amo-relay --shell /sbin/nologin amo-relay
          install -d -m 0755 /opt/amo-relay
          install -d -m 0755 /opt/amo-relay/bin
          install -d -m 0755 /opt/amo-relay/src
          install -d -o amo-relay -g amo-relay -m 0700 /var/lib/amo-relay

          rm -rf /opt/amo-relay/src/agent-memory-orchestrator
          if ! git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/amo-relay/src/agent-memory-orchestrator; then
            git clone '${RepositoryUrl}' /opt/amo-relay/src/agent-memory-orchestrator
            cd /opt/amo-relay/src/agent-memory-orchestrator
            git checkout '${RepositoryRef}'
          fi

          cd /opt/amo-relay/src/agent-memory-orchestrator/peer-netd
          go build -o /opt/amo-relay/bin/amo-peer-netd ./cmd/amo-peer-netd
          chmod 0755 /opt/amo-relay/bin/amo-peer-netd

          cat >/etc/systemd/system/amo-peer-relay.service <<'SERVICE'
          [Unit]
          Description=AMO peer relay and rendezvous helper
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=amo-relay
          Group=amo-relay
          WorkingDirectory=/var/lib/amo-relay
          ExecStart=/opt/amo-relay/bin/amo-peer-netd --node-id ${RelayNodeId} --listen /ip4/0.0.0.0/tcp/${RelayPort} --api 127.0.0.1:${RelayApiPort} --store-path /var/lib/amo-relay/inbox.jsonl --identity-key /var/lib/amo-relay/identity.key --rendezvous-server --relay-service --nat-service --force-public --advertise-addr /ip4/${RelayEip.PublicIp}/tcp/${RelayPort}
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/amo-relay

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable --now amo-peer-relay.service

          for attempt in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${RelayApiPort}/health" >/tmp/amo-relay-health.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/amo-relay-health.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/amo-relay-health.json").read_text(encoding="utf-8"))
          relay_addr = (health.get("listen_addrs") or [""])[0]
          info = {
              "ok": bool(relay_addr),
              "public_ip": "${RelayEip.PublicIp}",
              "relay_port": ${RelayPort},
              "node_id": "${RelayNodeId}",
              "peer_id": health.get("peer_id", ""),
              "relay_multiaddr": relay_addr,
              "rendezvous_addr": relay_addr,
              "rendezvous_namespace": "${RelayNamespace}",
              "health": health,
          }
          Path("/opt/amo-relay/relay.json").write_text(json.dumps(info, indent=2), encoding="utf-8")
          PY
          chmod 0644 /opt/amo-relay/relay.json

  RelayEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt RelayEip.AllocationId
      InstanceId: !Ref RelayInstance

Outputs:
  InstanceId:
    Description: EC2 instance id for the AMO relay helper.
    Value: !Ref RelayInstance
  PublicIp:
    Description: Elastic public IP assigned to the relay helper.
    Value: !GetAtt RelayEip.PublicIp
  RelayPort:
    Description: Public libp2p TCP port.
    Value: !Ref RelayPort
  RelayApiPort:
    Description: Localhost health/API port on the instance.
    Value: !Ref RelayApiPort
  RelayNamespace:
    Description: Rendezvous namespace clients should use.
    Value: !Ref RelayNamespace
  RelaySsmStatusCommand:
    Description: SSM command target for checking relay state.
    Value: !Sub >-
      aws ssm send-command --instance-ids ${RelayInstance} --document-name AWS-RunShellScript
      --parameters commands='["systemctl status amo-peer-relay.service --no-pager","cat /opt/amo-relay/relay.json"]'
