[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-orchestrator"
version = "0.1.2"
description = "Shared persistent memory and multi-agent orchestration over local MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Agent Memory Orchestrator Contributors" }
]
dependencies = [
  "kuzu>=0.9.0",
  "mcp[cli]>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "twine>=5.0.0",
]
models = [
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
]
slack = [
  "websocket-client>=1.8.0",
]

[project.scripts]
amo-cli = "agent_memory_orchestrator.app.cli:main"
amo-mcp = "agent_memory_orchestrator.mcp.server:main"
amo-daemon = "agent_memory_orchestrator.app.daemon:main"
amo-peer = "agent_memory_orchestrator.peer.server:main"
amo-hook = "agent_memory_orchestrator.hook:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_orchestrator = ["web/*.html", "web/*.css", "web/*.js", "bin/*/amo-peer-netd", "bin/*/amo-peer-netd.exe"]

[tool.setuptools.data-files]
"peer-netd" = [
  "peer-netd/README.md",
  "peer-netd/go.mod",
  "peer-netd/go.sum",
]
"peer-netd/cmd/amo-peer-netd" = [
  "peer-netd/cmd/amo-peer-netd/main.go",
]
"peer-netd/internal/config" = [
  "peer-netd/internal/config/config.go",
]
"peer-netd/internal/localapi" = [
  "peer-netd/internal/localapi/server.go",
]
"peer-netd/internal/p2p" = [
  "peer-netd/internal/p2p/node.go",
]
"peer-netd/internal/protocol" = [
  "peer-netd/internal/protocol/protocol.go",
]
"peer-netd/internal/rendezvous" = [
  "peer-netd/internal/rendezvous/rendezvous.go",
]
"peer-netd/internal/store" = [
  "peer-netd/internal/store/store.go",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "venv", ".data", ".tmp", ".pytest_cache", "pytest-cache-files-*"]
addopts = "-p no:cacheprovider"
