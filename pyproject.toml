[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-orchestrator"
version = "0.1.0"
description = "Shared persistent memory and multi-agent orchestration over local MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Agent Memory Orchestrator Contributors" }
]
dependencies = [
  "kuzu>=0.9.0",
  "mcp[cli]>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
models = [
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
]
slack = [
  "websocket-client>=1.8.0",
]

[project.scripts]
amo-cli = "agent_memory_orchestrator.cli:main"
amo-mcp = "agent_memory_orchestrator.mcp_server:main"
amo-daemon = "agent_memory_orchestrator.daemon:main"
amo-hook = "agent_memory_orchestrator.hook:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_orchestrator = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "venv", ".data", ".tmp", ".pytest_cache", "pytest-cache-files-*"]
addopts = "-p no:cacheprovider"
