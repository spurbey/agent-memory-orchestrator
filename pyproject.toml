[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-orchestrator"
version = "0.1.0"
description = "Shared persistent memory and multi-agent orchestration over local MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Agent Memory Orchestrator Contributors" }
]
dependencies = [
  "mcp[cli]>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
amo-cli = "agent_memory_orchestrator.cli:main"
amo-mcp = "agent_memory_orchestrator.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
