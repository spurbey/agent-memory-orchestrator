[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-orchestrator"
version = "0.1.4"
description = "Shared persistent memory and multi-agent orchestration over local MCP."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Agent Memory Orchestrator Contributors" }
]
dependencies = [
  "cryptography>=42.0.0",
  "kuzu>=0.9.0",
  "mcp[cli]>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "twine>=5.0.0",
]
models = [
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
]
slack = [
  "websocket-client>=1.8.0",
]

[project.scripts]
amo-cli = "agent_memory_orchestrator.runtime.cli.main:main"
amo-mcp = "agent_memory_orchestrator.runtime.mcp.server:main"
amo-daemon = "agent_memory_orchestrator.runtime.daemon.server:main"
amo-peer = "agent_memory_orchestrator.peer.server:main"
amo-hook = "agent_memory_orchestrator.runtime.hook.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_orchestrator = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/css/*.css",
  "web/js/core/*.js",
  "web/js/control-room/*.js",
  "web/js/graph/*.js",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = [".git", ".venv", "venv", ".data", ".tmp", ".pytest_cache", "pytest-cache-files-*"]
addopts = "-p no:cacheprovider"
